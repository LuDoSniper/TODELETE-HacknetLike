name: Game 3 checks
on:
  push:
    branches: [game-3]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run setup
      - run: npm test
      - run: npm run build
